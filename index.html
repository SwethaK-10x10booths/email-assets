<div style="width:378px;background:#f3f3f3;font-family:Arial,sans-serif;">

    <!-- Top Section -->
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="padding:12px 15px;">
        <tr>

            <!-- Logo -->
            <td width="42%" align="center" valign="middle">
                <img src="https://swethak-10x10booths.github.io/email-assets/logo.png"
                     width="110"
                     style="display:block;border:0;">
            </td>

            <!-- Divider -->
            <td width="2" bgcolor="#E22901"></td>

            <!-- Contact Details -->
            <td valign="top" style="padding-left:12px;">

                <div style="font-size:14px;font-weight:bold;color:#E22901;line-height:16px;">
                    ${name}
                </div>

                <div style="font-size:10px;color:#000;padding-bottom:6px;">
                    ${designation}
                </div>

                <table cellpadding="0" cellspacing="0" border="0">

                    <tr>
                        <td width="14">
                            <img src="https://swethak-10x10booths.github.io/email-assets/mobile.png"
                                 width="12">
                        </td>
                        <td style="font-size:8px;padding-left:5px;">
                            ${mobile}
                        </td>
                    </tr>

                    <tr>
                        <td width="14">
                            <img src="https://swethak-10x10booths.github.io/email-assets/mail.png"
                                 width="12">
                        </td>
                        <td style="font-size:8px;padding-left:5px;">
                            ${email}
                        </td>
                    </tr>

                    <tr>
                        <td width="14">
                            <img src="https://swethak-10x10booths.github.io/email-assets/website.png"
                                 width="12">
                        </td>
                        <td style="font-size:8px;padding-left:5px;">
                            www.10x10booths.com
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">
                            <img src="https://swethak-10x10booths.github.io/email-assets/location.png"
                                 width="12">
                        </td>
                        <td style="font-size:7px;padding-left:5px;line-height:10px;">
                            ${address}
                        </td>
                    </tr>

                </table>

                <!-- Social Icons -->
                <table cellpadding="0" cellspacing="0" border="0" style="margin-top:6px;">
                    <tr>

                        <td>
                            <a href="https://www.linkedin.com/company/10x10-booths/">
                                <img src="https://swethak-10x10booths.github.io/email-assets/linkedin.png"
                                     width="16">
                            </a>
                        </td>

                        <td width="8"></td>

                        <td>
                            <a href="https://www.instagram.com/10x10_booths/">
                                <img src="https://swethak-10x10booths.github.io/email-assets/instagram.png"
                                     width="16">
                            </a>
                        </td>

                        <td width="8"></td>

                        <td>
                            <a href="https://www.youtube.com/@10x10Booths">
                                <img src="https://swethak-10x10booths.github.io/email-assets/youtube.png"
                                     width="16">
                            </a>
                        </td>

                    </tr>
                </table>

            </td>

        </tr>
    </table>

    <!-- Global Offices -->
    <div style="text-align:center;padding:4px 0 2px 0;font-size:7px;color:#000;">
        Our Global Offices
    </div>

    <div style="text-align:center;padding-bottom:6px;font-size:8px;">
        <span style="color:#E22901;font-weight:bold;">US</span> - Texas
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <span style="color:#E22901;font-weight:bold;">UK</span> - London
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <span style="color:#E22901;font-weight:bold;">NL</span> - Rotterdam
    </div>

    <!-- Banner -->
    <img src="https://swethak-10x10booths.github.io/email-assets/banner.png"
         width="378"
         style="display:block;border:0;width:378px;">

</div>
