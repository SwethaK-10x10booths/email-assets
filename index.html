async function copyGmailSignature() {

    const signatureHTML =
        document.getElementById("emailSignature").innerHTML;

    const blob = new Blob(
        [signatureHTML],
        { type: "text/html" }
    );

    const data = [
        new ClipboardItem({
            "text/html": blob
        })
    ];

    await navigator.clipboard.write(data);

    alert("Gmail signature copied!");

}

    async function copyHubSpotHTML() {

    try {

        const signatureHTML =
            document.getElementById("emailSignature").innerHTML;

        await navigator.clipboard.writeText(signatureHTML);

        alert(
            "HubSpot HTML copied!\n\nOpen HubSpot → HTML tab → Paste → Save."
        );

    } catch (error) {

        console.error(error);

        alert("Failed to copy HubSpot HTML.");

    }

}

   function copyOutlookSignature() {

    const signature =
        document.getElementById("outlookSignature");

    const temp = document.createElement("div");

    temp.style.background = "#ffffff";
    temp.innerHTML = signature.innerHTML;

    temp.style.position = "fixed";
    temp.style.left = "-9999px";
    temp.style.top = "0";

    document.body.appendChild(temp);

    const range = document.createRange();
    range.selectNodeContents(temp);

    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

    document.execCommand("copy");

    selection.removeAllRanges();

    document.body.removeChild(temp);

    alert("Outlook signature copied successfully!");
}
